<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="ball-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6750A4" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
  </defs>
  <!-- Outer Circle (Soccer Ball) -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#ball-grad)" stroke-width="2.5" />
  
  <!-- Center Pentagon -->
  <polygon points="16,9.5 21,13 19,19 13,19 11,13" fill="url(#ball-grad)" />
  
  <!-- Connecting lines to outer shell -->
  <line x1="16" y1="9.5" x2="16" y2="2" stroke="url(#ball-grad)" stroke-width="2" />
  <line x1="21" y1="13" x2="29" y2="10" stroke="url(#ball-grad)" stroke-width="2" />
  <line x1="19" y1="19" x2="24" y2="27" stroke="url(#ball-grad)" stroke-width="2" />
  <line x1="13" y1="19" x2="8" y2="27" stroke="url(#ball-grad)" stroke-width="2" />
  <line x1="11" y1="13" x2="3" y2="10" stroke="url(#ball-grad)" stroke-width="2" />
</svg>
